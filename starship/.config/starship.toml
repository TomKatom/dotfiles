"$schema" = "https://starship.rs/config-schema.json"

# An explicit format keeps starship from probing for every module it knows.
format = """
$username$hostname$directory$git_branch$git_state$git_status$c$cmake$python$rust$cmd_duration$jobs
$character"""

palette = "catppuccin_macchiato"

[username]
style_user = "bold lavender"
style_root = "bold red"

[hostname]
style = "bold lavender"

[directory]
style = "bold blue"
read_only_style = "red"
truncation_length = 4

[git_branch]
symbol = " "
style = "bold mauve"

[git_state]
style = "bold yellow"

[git_status]
style = "bold peach"

[c]
style = "bold sapphire"

[cmake]
style = "bold sapphire"

[python]
style = "bold yellow"

[rust]
style = "bold peach"

[cmd_duration]
style = "yellow"

[jobs]
style = "bold teal"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"
