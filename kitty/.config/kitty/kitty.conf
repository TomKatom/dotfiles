include themes/catppuccin-macchiato.conf

# Match Hyprland's mauve active border.
active_border_color #c6a0f6

font_family      family="JetBrainsMono Nerd Font"
font_size        11
modify_font      cell_height 110%
disable_ligatures cursor

window_padding_width 8
inactive_text_alpha  0.85

tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index} {title}"

cursor_blink_interval 0
cursor_trail          3

url_style              curly
show_hyperlink_targets always

scrollback_lines 10000
# -+F overrides the -F in $LESS, which would close short output (show_last_command_output) instantly.
scrollback_pager less -+F --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

strip_trailing_spaces smart
enable_audio_bell     no
notify_on_cmd_finish  unfocused 10.0
# Shell integration keeps idle prompts out of the count, so this only asks while a command runs.
confirm_os_window_close -1
update_check_interval   0

input_delay  0
repaint_delay 5

enabled_layouts splits,stack
map kitty_mod+enter launch --cwd=current --location=split
map kitty_mod+t     launch --cwd=current --type=tab
map kitty_mod+n     launch --cwd=current --type=os-window
map kitty_mod+z     toggle_layout stack
