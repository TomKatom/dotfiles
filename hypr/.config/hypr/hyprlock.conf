# Minimal lock screen: blurred wallpaper, clock, password field.
# Blur only costs GPU while the screen is locked.
# Reference example: /usr/share/hypr/ (shipped with the package)

$mauve = rgb(c6a0f6)
$red = rgb(ed8796)
$surface0 = rgb(363a4f)
$text = rgb(cad3f5)
$subtext0Alpha = a5adcb

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/USER/Pictures/Wallpapers/default.jpg
    blur_passes = 2
    blur_size = 6
}

label {
    monitor =
    text = $TIME
    color = $text
    font_family = Inter
    font_size = 72
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = $mauve
    inner_color = $surface0
    font_color = $text
    check_color = $mauve
    fail_color = $red
    fade_on_empty = false
    placeholder_text = <span foreground="##$subtext0Alpha">Password</span>
    position = 0, -40
    halign = center
    valign = center
}
