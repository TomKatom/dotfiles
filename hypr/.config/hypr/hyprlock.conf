# Minimal lock screen: blurred wallpaper, clock, password field.
# Blur only costs GPU while the screen is locked.
# Reference example: /usr/share/hypr/ (shipped with the package)

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/USER/Pictures/Wallpapers/default.jpg
    blur_passes = 2
    blur_size = 6
}

label {
    monitor =
    text = $TIME
    font_family = Inter
    font_size = 72
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    placeholder_text = Password
    position = 0, -40
    halign = center
    valign = center
}
