# hyprpaper 0.8+ block syntax.
# An empty `monitor =` is a catch-all for every output.
# For a per-monitor wallpaper, add another block with monitor = DP-1 (see `hyprctl monitors`).

splash = false

wallpaper {
    monitor =
    path = /home/tom/Pictures/Wallpapers/default.jpg
    fit_mode = cover

}
