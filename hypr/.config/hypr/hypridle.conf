# Lock -> screen off -> (optional) suspend.
# Fullscreen windows and apps holding an idle inhibitor (video players,
# browsers playing video) pause these timers.

general {
    lock_cmd = pidof hyprlock || hyprlock                  # one instance only
    before_sleep_cmd = loginctl lock-session               # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 10 min: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min: screen off
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min: suspend. Off by default, since a long build or model run
# doesn't count as "activity" and would get suspended mid-way.
